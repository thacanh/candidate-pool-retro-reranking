name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install
        run: |
          python -m pip install torch==2.2.2+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[analysis,test]'
      - name: Check files
        run: python -m rerank.data.verify_release
      - name: Test
        run: python -m pytest -q
