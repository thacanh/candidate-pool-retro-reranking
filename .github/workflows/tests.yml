name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install
        run: |
          python -m pip install torch==2.2.2+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[analysis,test]'
          python -m pip check
      - name: Check files
        run: python -m rerank.data.verify_release
      - name: Test
        run: python -m pytest -q
      - name: Check documented examples
        run: |
          python scripts/inspect_candidates.py --reaction-id 45033 --seed 42 > /dev/null
          python -m rerank.figures.plot_figures --repo-root . --output-dir figures_rebuilt
          test -s figures_rebuilt/figure2_dd_coverage_effects.pdf
          test -s figures_rebuilt/figure3_dd_transfer_shift.pdf
          test -s figures_rebuilt/figure4_dd_adaptation.pdf
          test -s figures_rebuilt/figure5_dd_operational_performance.pdf
          test ! -e figures_rebuilt/figure1_dd_design.pdf
